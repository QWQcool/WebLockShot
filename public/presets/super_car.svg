<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="carBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080c"/>
      <stop offset="50%" stop-color="#0b131c"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
    <radialGradient id="cyanHeadlight" cx="30%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#carBg)"/>
  <circle cx="300" cy="270" r="240" fill="url(#cyanHeadlight)"/>

  <!-- Wet Asphalt Puddle Reflection -->
  <ellipse cx="300" cy="460" rx="230" ry="45" fill="#030712" stroke="#0ea5e9" stroke-width="2" opacity="0.4"/>

  <!-- Sleek Supercar Silhouette -->
  <g transform="translate(100, 190)">
    <!-- Aerodynamic Chassis -->
    <path d="M 30 190 C 70 170 140 160 210 130 C 270 100 330 100 360 130 C 380 150 400 180 390 195 C 330 205 150 215 30 190 Z" fill="url(#carBody)"/>

    <!-- Cockpit Canopy Glass -->
    <path d="M 180 140 C 220 110 280 110 320 135 C 300 150 240 155 180 140 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>

    <!-- LED Headlight Laser Streaks -->
    <polygon points="30,185 10,195 90,190" fill="#38bdf8"/>
    <line x1="30" y1="185" x2="-60" y2="210" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="30" y1="185" x2="-90" y2="240" stroke="#7dd3fc" stroke-width="2" opacity="0.6"/>

    <!-- Neon Tail light streak -->
    <line x1="380" y1="180" x2="480" y2="160" stroke="#ff0055" stroke-width="4" stroke-linecap="round"/>

    <!-- Wheels -->
    <ellipse cx="110" cy="195" rx="36" ry="36" fill="#030712" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="110" cy="195" r="14" fill="#38bdf8" opacity="0.8"/>
    <ellipse cx="330" cy="190" rx="38" ry="38" fill="#030712" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="330" cy="190" r="15" fill="#38bdf8" opacity="0.8"/>

    <!-- Raindrop particles and spray -->
    <line x1="80" y1="100" x2="70" y2="120" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <line x1="220" y1="60" x2="210" y2="80" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
    <line x1="340" y1="80" x2="330" y2="100" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Typography Badge -->
  <rect x="40" y="40" width="135" height="28" rx="6" fill="#0b131c" stroke="#38bdf8" stroke-width="1"/>
  <text x="50" y="59" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">HYPERCAR AERO</text>
  <text x="40" y="550" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold">超级跑车雨夜疾驰</text>
  <text x="40" y="572" fill="#475569" font-family="sans-serif" font-size="13">NIGHT RAIN WATER SPRAY TAILLIGHT 8K</text>
</svg>
