<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ringBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090d"/>
      <stop offset="50%" stop-color="#0f141f"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="causticGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7eb6"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="platinum" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#ringBg)"/>
  <circle cx="300" cy="270" r="230" fill="url(#causticGlow)"/>

  <!-- Mirror Pedestal -->
  <ellipse cx="300" cy="460" rx="190" ry="38" fill="#0b0f17" stroke="#1e293b" stroke-width="2"/>

  <!-- Ring Band -->
  <g transform="translate(150, 150)">
    <ellipse cx="150" cy="220" rx="90" ry="60" fill="none" stroke="url(#platinum)" stroke-width="16"/>
    <!-- Ring Inner Rim Reflection -->
    <ellipse cx="150" cy="220" rx="80" ry="50" fill="none" stroke="#fff" stroke-width="3" opacity="0.6"/>

    <!-- Diamond Crown Setting -->
    <polygon points="120,130 180,130 195,110 105,110" fill="url(#platinum)"/>

    <!-- Brilliant Diamond -->
    <!-- Table -->
    <polygon points="115,80 185,80 205,55 95,55" fill="#f0f9ff" stroke="#fff" stroke-width="1.5"/>
    <!-- Pavilion / Facets -->
    <polygon points="95,55 150,15 205,55" fill="url(#rainbow)" opacity="0.85"/>
    <polygon points="115,80 150,15 185,80" fill="#fff" opacity="0.9"/>
    <polygon points="95,55 115,80 150,15" fill="#38bdf8" opacity="0.8"/>
    <polygon points="205,55 185,80 150,15" fill="#ff7eb6" opacity="0.75"/>

    <!-- Prismatic Starburst Flares -->
    <line x1="150" y1="-20" x2="150" y2="50" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="115" y1="15" x2="185" y2="15" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="125" y1="-10" x2="175" y2="40" stroke="url(#rainbow)" stroke-width="2"/>

    <circle cx="150" cy="15" r="4" fill="#fff"/>
    <circle cx="95" cy="55" r="2.5" fill="#fff"/>
    <circle cx="205" cy="55" r="2.5" fill="#fff"/>
  </g>

  <!-- Typography Badge -->
  <rect x="40" y="40" width="135" height="28" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
  <text x="50" y="59" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">FINE JEWELRY</text>
  <text x="40" y="550" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold">璀璨珠宝钻石微距</text>
  <text x="40" y="572" fill="#64748b" font-family="sans-serif" font-size="13">PRISMATIC REFRACTION MACRO 100MM</text>
</svg>
