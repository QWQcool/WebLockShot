<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1419"/>
      <stop offset="50%" stop-color="#11242d"/>
      <stop offset="100%" stop-color="#070c0f"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7eb6"/>
      <stop offset="100%" stop-color="#e02476"/>
    </linearGradient>
    <linearGradient id="neonTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39c5bb"/>
      <stop offset="100%" stop-color="#7ef4ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39c5bb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#39c5bb" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="220" fill="url(#glow)"/>

  <!-- Reflection Ground Grid -->
  <ellipse cx="300" cy="480" rx="220" ry="45" fill="#000" opacity="0.6"/>
  <path d="M120 480 Q 300 520 480 480" stroke="url(#neonTeal)" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Futuristic Sneaker Silhouette -->
  <g transform="translate(110, 160)" filter="url(#neonBlur)">
    <!-- Sole -->
    <path d="M 40 230 C 90 245 220 250 310 215 C 340 200 360 170 365 140 C 340 145 310 155 270 170 C 190 200 110 205 40 230 Z" fill="url(#neonTeal)" opacity="0.9"/>
    <!-- Sole Air Cushion -->
    <ellipse cx="230" cy="220" rx="35" ry="12" fill="#fff" opacity="0.8"/>
    <ellipse cx="140" cy="230" rx="40" ry="10" fill="#fff" opacity="0.7"/>

    <!-- Upper Body -->
    <path d="M 50 220 C 70 150 120 90 180 60 C 210 45 240 50 250 70 C 260 90 280 120 330 135 C 350 140 360 160 340 180 C 270 185 170 200 50 220 Z" fill="#172e38" stroke="url(#neonPink)" stroke-width="3"/>

    <!-- Tech Accent Plates -->
    <path d="M 170 70 L 220 130 L 190 160 L 140 110 Z" fill="url(#neonPink)" opacity="0.75"/>
    <path d="M 230 110 L 290 140 L 260 170 L 200 140 Z" fill="url(#neonTeal)" opacity="0.6"/>

    <!-- Speed Laces / Cable system -->
    <line x1="160" y1="90" x2="200" y2="80" stroke="#fff" stroke-width="2"/>
    <line x1="180" y1="110" x2="220" y2="100" stroke="#fff" stroke-width="2"/>
    <line x1="200" y1="130" x2="240" y2="120" stroke="#fff" stroke-width="2"/>

    <!-- Water Splash Dynamic Drops -->
    <circle cx="360" cy="230" r="6" fill="#39c5bb"/>
    <circle cx="385" cy="215" r="4" fill="#ff7eb6"/>
    <circle cx="60" cy="250" r="5" fill="#39c5bb"/>
    <circle cx="30" cy="235" r="3" fill="#fff"/>
  </g>

  <!-- Typography Badge -->
  <rect x="40" y="40" width="130" height="28" rx="6" fill="#11242d" stroke="#39c5bb" stroke-width="1"/>
  <text x="52" y="59" fill="#39c5bb" font-family="sans-serif" font-size="13" font-weight="bold">CYBER SNEAKER</text>
  <text x="40" y="550" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold">潮流穿搭机能走秀</text>
  <text x="40" y="572" fill="#5b7a86" font-family="sans-serif" font-size="13">WATERPROOF DYNAMIC RUNWAY 8K</text>
</svg>
