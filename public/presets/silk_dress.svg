<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="dressBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190d16"/>
      <stop offset="50%" stop-color="#2b1325"/>
      <stop offset="100%" stop-color="#10070e"/>
    </linearGradient>
    <radialGradient id="pinkSpotlight" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ff7eb6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff7eb6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silkFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb3d9"/>
      <stop offset="40%" stop-color="#ff7eb6"/>
      <stop offset="80%" stop-color="#a81966"/>
      <stop offset="100%" stop-color="#4a052c"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#dressBg)"/>
  <circle cx="300" cy="260" r="230" fill="url(#pinkSpotlight)"/>

  <!-- Flowing Silk Waves -->
  <g transform="translate(140, 100)">
    <path d="M 160 50 C 130 110 80 180 60 250 C 40 320 80 370 140 400 C 200 420 280 380 260 300 C 240 220 180 140 160 50 Z" fill="url(#silkFlow)" opacity="0.85"/>
    <path d="M 180 70 C 210 130 250 200 230 280 C 210 360 140 400 90 380 C 150 350 180 280 190 200 C 200 130 190 90 180 70 Z" fill="#fff" opacity="0.35"/>
    <path d="M 100 150 C 70 220 50 300 90 380 C 130 330 140 260 130 190 Z" fill="#ff7eb6" opacity="0.6"/>
  </g>

  <!-- Typography Badge -->
  <rect x="40" y="40" width="135" height="28" rx="6" fill="#2b1325" stroke="#ff7eb6" stroke-width="1"/>
  <text x="50" y="59" fill="#ff7eb6" font-family="sans-serif" font-size="13" font-weight="bold">HAUTE COUTURE</text>
  <text x="40" y="550" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold">高定丝绸晚礼服光影</text>
  <text x="40" y="572" fill="#8c5b78" font-family="sans-serif" font-size="13">FLOWING DRAPE FABRIC MOTION 8K</text>
</svg>
