<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="foodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e0b"/>
      <stop offset="50%" stop-color="#2a1611"/>
      <stop offset="100%" stop-color="#0f0705"/>
    </linearGradient>
    <radialGradient id="warmLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff9933" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff9933" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="choc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2511"/>
      <stop offset="100%" stop-color="#220e06"/>
    </linearGradient>
    <linearGradient id="goldCaramel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc04d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#foodBg)"/>
  <circle cx="300" cy="280" r="230" fill="url(#warmLight)"/>

  <!-- Wooden Slate Plate -->
  <ellipse cx="300" cy="450" rx="200" ry="40" fill="#140b07" stroke="#3d2115" stroke-width="3"/>

  <!-- Lava Cake Base -->
  <g transform="translate(180, 220)" filter="url(#softGlow)">
    <path d="M 40 180 C 35 120 70 80 120 75 C 170 80 205 120 200 180 C 180 205 60 205 40 180 Z" fill="url(#choc)"/>
    
    <!-- Molten Golden Lava Flow -->
    <path d="M 100 76 C 110 95 110 130 95 160 C 85 180 115 195 135 170 C 145 150 140 100 130 76 Z" fill="url(#goldCaramel)"/>
    <ellipse cx="115" cy="180" rx="18" ry="8" fill="url(#goldCaramel)"/>

    <!-- Steam Wisps in Slow Motion -->
    <path d="M 100 60 Q 80 20 105 -20 T 95 -60" stroke="#ffeedd" stroke-width="3" fill="none" opacity="0.45"/>
    <path d="M 130 50 Q 155 10 130 -30 T 145 -70" stroke="#ffeedd" stroke-width="3.5" fill="none" opacity="0.4"/>
    <path d="M 115 40 Q 130 0 115 -40" stroke="#ffeedd" stroke-width="2" fill="none" opacity="0.3"/>

    <!-- Sugar Garnish Sparkles -->
    <circle cx="70" cy="110" r="2" fill="#fff"/>
    <circle cx="160" cy="125" r="2.5" fill="#fff"/>
    <circle cx="140" cy="95" r="1.8" fill="#fff"/>
  </g>

  <!-- Typography Badge -->
  <rect x="40" y="40" width="130" height="28" rx="6" fill="#24130d" stroke="#f59e0b" stroke-width="1"/>
  <text x="50" y="59" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="bold">MOLTEN DESSERT</text>
  <text x="40" y="550" fill="#fff" font-family="sans-serif" font-size="20" font-weight="bold">美食甜品慢动作爆浆</text>
  <text x="40" y="572" fill="#8c6252" font-family="sans-serif" font-size="13">120FPS SLOW-MO STEAM GLOSS 8K</text>
</svg>
