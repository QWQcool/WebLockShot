name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 质量门禁：测试与 lint 不过不部署
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type Check (strict)
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Unit Tests
        run: npm test
      # Chaos 冒烟（边缘情况专项）：验证 CLI 全程存活。非阻断（部署不依赖），失败仅告警
      - name: Chaos Smoke (non-blocking)
        run: npm run test:chaos
        continue-on-error: true

  # 实机回归（真实浏览器）：把「线上部署形态」纳入门禁
  # —— 2026-09-11 两起线上事故（子路径资源 404 白屏 / tldraw 生产许可闸门致画布消失）
  #    在本地全部套件下都是绿的，因为本地是「根路径 + http://127.0.0.1」，与线上形态不同。
  e2e:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # 跳过 npm ci 阶段隐式的浏览器下载，改由下一步显式安装（更快、更可控）
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      # 与 deploy 保持一致：带上 license key 构建，使 e2e:prod 校验的是**线上真实形态**。
      # 未配置 secret 时为空字符串 → e2e:prod 自动切到「未授权分支」（校验闸门 + 诚实提示）；
      # 配置后自动切到「已授权分支」，于是本 job 顺带成为「key 是否有效 / 是否过期」的监控。
      - name: Build (root base)
        run: npm run build
        env:
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.TLDRAW_LICENSE_KEY }}
      - name: E2E · 画布核心链路
        run: npm run e2e -- --skip-build
      - name: E2E · 子路径部署形态（GitHub Pages base）
        run: npm run e2e:basepath
        env:
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.TLDRAW_LICENSE_KEY }}
      - name: E2E · 生产模式（tldraw 许可闸门 + 诚实提示）
        run: npm run e2e:prod -- --skip-build

  deploy:
    needs: [quality-gate, e2e]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          # tldraw 官方许可路径（**不是绕过**）：tldraw 在「生产环境 + 无 license key」时
          # 会在约 5 秒后停止渲染整个编辑器（https 非回环地址，本地 http/localhost 豁免）。
          # 在仓库 Settings → Secrets 配置 TLDRAW_LICENSE_KEY 后即可生效；
          # 未配置时为空字符串，行为与现在完全一致（画布由页面内的诚实提示条说明原因）。
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.TLDRAW_LICENSE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
