name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 质量门禁：测试与 lint 不过不部署
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type Check (strict)
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Unit Tests
        run: npm test
      # Chaos 冒烟（边缘情况专项）：验证 CLI 全程存活。非阻断（部署不依赖），失败仅告警
      - name: Chaos Smoke (non-blocking)
        run: npm run test:chaos
        continue-on-error: true

  deploy:
    needs: quality-gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          # tldraw 官方许可路径（**不是绕过**）：tldraw 在「生产环境 + 无 license key」时
          # 会在约 5 秒后停止渲染整个编辑器（https 非回环地址，本地 http/localhost 豁免）。
          # 在仓库 Settings → Secrets 配置 TLDRAW_LICENSE_KEY 后即可生效；
          # 未配置时为空字符串，行为与现在完全一致（画布由页面内的诚实提示条说明原因）。
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.TLDRAW_LICENSE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
